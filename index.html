<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: Theken-Kasse — links Gast wählen, Mitte Artikeltasten nach Kategorie, rechts der Bon. Am Handy untereinander. */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --line:#d9ddd2; --fg:#1d2a20; --muted:#5f6b60;
  --green:#2c5a37; --green-fg:#ffffff; --green-soft:#e3ece2; --gold:#e3bf3c; --gold-fg:#2a2306;
  --warn:#b4471f; --warn-soft:#f8e4da; --ok:#2f7d43;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151a16; --surface:#1e251f; --line:#334036; --fg:#e8ede5; --muted:#9fab9f;
  --green:#4f8f5d; --green-fg:#0d140e; --green-soft:#24362a; --gold:#e8c84f; --gold-fg:#221c04;
  --warn:#ee8a63; --warn-soft:#3b2219; --ok:#6cc583; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a16; --surface:#1e251f; --line:#334036; --fg:#e8ede5; --muted:#9fab9f;
  --green:#4f8f5d; --green-fg:#0d140e; --green-soft:#24362a; --gold:#e8c84f; --gold-fg:#221c04;
  --warn:#ee8a63; --warn-soft:#3b2219; --ok:#6cc583; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 20px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 260px;min-width:0}
.brand .logo{height:58px;width:auto;flex:none}
.brand>div{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.7rem;text-transform:uppercase;color:var(--green);line-height:1}
.brand small{color:var(--muted);font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--green-soft);font-weight:600;font-size:.9rem}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;min-height:46px}
.btn.primary{background:var(--green);color:var(--green-fg);border-color:var(--green)}
.btn.gold{background:var(--gold);color:var(--gold-fg);border-color:var(--gold)}
.btn.danger{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav .btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:minmax(180px,220px) minmax(0,1fr) minmax(260px,320px);gap:14px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr) minmax(250px,300px)}.gaeste{grid-column:1/-1}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:8px}
.namen{display:flex;flex-wrap:wrap;gap:6px;max-height:52vh;overflow:auto}
@media (max-width:980px){.namen{max-height:none}}
.name{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:500;min-height:42px}
.name[aria-pressed="true"]{background:var(--green);color:var(--green-fg);border-color:var(--green)}
.neu{display:flex;gap:6px;margin-top:10px}
.neu input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.tab{flex:0 0 auto;border:0;background:transparent;border-bottom:3px solid transparent;padding:8px 10px;font-family:var(--display);font-size:1.15rem;font-weight:700;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--green);border-color:var(--gold)}
.artikel{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.art{position:relative;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.art:active{transform:scale(.97)}
.art b{font-weight:600;line-height:1.2}
.art span{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.art span em{font-style:normal;color:var(--fg);font-weight:600}
.art .badge{position:absolute;top:-7px;right:-7px;background:var(--gold);color:var(--gold-fg);font-weight:700;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:.85rem}
.bon{position:sticky;top:12px}
.bonliste{display:flex;flex-direction:column;gap:6px;margin:8px 0;max-height:34vh;overflow:auto}
.zeile{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.zeile .n{min-width:0;overflow-wrap:anywhere}
.zeile .n small{display:block;color:var(--muted)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:1.1rem}
.summe{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--fg);padding-top:10px;margin-top:6px}
.summe strong{font-family:var(--display);font-size:2.6rem;line-height:1}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.rg input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:1.1rem}
.rgout{display:flex;justify-content:space-between;align-items:center;background:var(--green-soft);border-radius:10px;padding:10px;font-weight:600}
.schnell{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.schnell button{flex:1 1 0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 4px;font-weight:600}
.actions{display:grid;gap:8px;margin-top:10px}
.actions .btn.primary{font-size:1.25rem;min-height:60px}
.leer{color:var(--muted);font-size:.95rem;padding:10px 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.log{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:.9rem;max-height:20vh;overflow:auto}
.log div{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.log div.st{text-decoration:line-through}
.wide{max-width:900px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-family:var(--display);font-size:2rem;font-weight:700}
.kpi.diff-neg .v{color:var(--warn)} .kpi.diff-ok .v{color:var(--ok)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right}
tr.kat td{font-weight:700;background:var(--green-soft)}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 180px}
.field input{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:1.1rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.start{max-width:460px;margin:8vh auto 0}
.preisgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.preisgrid label{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.preisgrid input{width:84px;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:right;background:var(--surface)}
.hint{color:var(--muted);font-size:.9rem}
.name{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.name small{font-size:.78rem;opacity:.8;font-variant-numeric:tabular-nums}
.name.offen{border-color:var(--gold);border-width:2px}
.name .schuld{color:var(--warn);font-weight:600}
.name[aria-pressed="true"] .schuld{color:var(--green-fg)}
.alt{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-weight:600;margin-top:8px}
.toggle{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--green)}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--green-soft)}
.tag.an{background:var(--warn-soft);color:var(--warn)}
#bondruck{display:none}
@media print{
  :root{padding:0!important} body{background:#fff!important;padding:0!important;margin:0}
  #app,.toast{display:none!important}
  #bondruck{display:block;width:var(--bonw,80mm);padding:2mm 3mm 6mm;color:#000;font-family:var(--body);font-size:12px;line-height:1.35}
  #bondruck .kopf{text-align:center;margin-bottom:2mm}
  #bondruck .kopf img{width:22mm;height:auto}
  #bondruck .kopf b{display:block;font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.02em}
  #bondruck .meta{display:flex;justify-content:space-between;border-bottom:1px dashed #000;padding-bottom:1.5mm;margin-bottom:1.5mm}
  #bondruck .pz{display:grid;grid-template-columns:auto 1fr auto;gap:0 2mm}
  #bondruck .pz span:last-child{text-align:right}
  #bondruck .sum{display:flex;justify-content:space-between;border-top:2px solid #000;margin-top:1.5mm;padding-top:1mm;font-size:16px;font-weight:700}
  #bondruck .gz{display:flex;justify-content:space-between}
  #bondruck .fuss{text-align:center;margin-top:3mm;border-top:1px dashed #000;padding-top:2mm}
}
@media (prefers-reduced-motion:reduce){.art:active{transform:none}}
</style>

<body>
<div id="app">
  <header class="top">
    <div class="brand"><img class="logo" src="logo.png" alt="Wappen Schützenverein Oberschopfheim"><div><h1>Schützenverein Oberschopfheim</h1><small>Vereinsheim-Kasse · Deckel</small></div></div>
    <span class="pill num" id="abendPill">Kasse wird geladen …</span>
    <nav class="nav" aria-label="Bereiche">
      <button class="btn" data-view="kasse" aria-pressed="true">Kasse</button>
      <button class="btn" data-view="abrechnung" aria-pressed="false">Abendabrechnung</button>
      <button class="btn" data-view="konten" aria-pressed="false">Angeschrieben</button>
      <button class="btn" data-view="preise" aria-pressed="false">Preise</button>
      <button class="btn" id="sperrBtn" hidden>Sperren</button>
    </nav>
  </header>
  <div id="modeHint" hidden class="pill warn" style="margin-bottom:12px"></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div id="bondruck" aria-hidden="true"></div>
<style id="pagesize">@page{size:80mm auto;margin:0}</style>

<script>
const ARTIKEL = [
 ["cola","Alkoholfrei","Cola","0,2 l",1.20],["fanta","Alkoholfrei","Fanta","0,2 l",1.20],["saft","Alkoholfrei","Saft","0,2 l",1.20],["wasser02","Alkoholfrei","Wasser","0,2 l",1.20],
 ["spezi","Alkoholfrei","Spezi","0,5 l",2.00],["topfit","Alkoholfrei","TopFit","0,5 l",2.00],["apfelschorle","Alkoholfrei","Apfelschorle","0,5 l",2.00],["johschorle","Alkoholfrei","Johannisbeerschorle","0,5 l",2.00],
 ["mwclassic","Alkoholfrei","Mineralwasser classic","0,5 l",2.00],["mwmedium","Alkoholfrei","Mineralwasser medium","0,5 l",2.00],["kaffee","Alkoholfrei","Kaffee","Tasse",1.50],["tee","Alkoholfrei","Tee","Tasse",1.50],
 ["pils","Bier","Pils","0,33 l",2.50],["radler","Bier","Radler","0,33 l",2.50],["weizen","Bier","Weizen","0,5 l",3.00],["colaweizen","Bier","Cola-Weizen","0,5 l",3.00],
 ["wschorleweiss","Wein & Sekt","Weinschorle weiß","0,25 l",2.30],["wschorlerot","Wein & Sekt","Weinschorle rot","0,25 l",2.80],["weisswein","Wein & Sekt","Weißwein (Müller-Thurgau)","0,25 l",2.80],["rotwein","Wein & Sekt","Rotwein (Spätburgunder)","0,25 l",3.00],
 ["sektglas","Wein & Sekt","Sekt Glas","0,1 l",2.00],["sektflasche","Wein & Sekt","Sekt Flasche","0,7 l",9.00],["aperol","Wein & Sekt","Aperol Spritz","Glas",3.50],
 ["cognack","Spirituosen","Cognac klein","klein",2.50],["cognacg","Spirituosen","Cognac groß","groß",3.00],["rumk","Spirituosen","Rum klein","klein",2.50],["rumg","Spirituosen","Rum groß","groß",3.00],
 ["whiskeyk","Spirituosen","Whiskey klein","klein",2.50],["whiskeyg","Spirituosen","Whiskey groß","groß",3.00],["ramazzotti","Spirituosen","Ramazzotti","4 cl",2.50],["schnaps","Spirituosen","Schnaps","2 cl",2.00],["likoer","Spirituosen","Likör","2 cl",2.00],
 ["salzstaengele","Speisen","Salzstängele","",1.00],["salzbrezeln","Speisen","Salzbrezeln","",1.00],["chips","Speisen","Chips","",1.20],["erdnuesse","Speisen","Erdnüsse","",1.20],["knabber","Speisen","Sonstiges Knabberzeug","",1.20],
 ["wuerste","Speisen","1 Paar Würste mit Brot","",4.50],["bagsalami","Speisen","Baguette Salami","",4.50],["bagschinken","Speisen","Baguette Schinken","",4.50],["wurstweckle","Speisen","Wurstweckle","",2.50],["kaeseweckle","Speisen","Käseweckle","",2.50]
].map(([id,k,n,m,p])=>({id,k,n,m,p}));
const KATS=["Alkoholfrei","Bier","Wein & Sekt","Spirituosen","Speisen"];
const BYID=Object.fromEntries(ARTIKEL.map(a=>[a.id,a]));
const r2=v=>Math.round(v*100)/100;
const euro=v=>r2(v).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
function parseNum(s){if(s==null)return null;s=String(s).trim().replace(/€/g,"").replace(/\s/g,"");if(!s)return null;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=Number(s);return isFinite(n)?r2(n):null}
function jetzt(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,19)}
function datumDE(z){return z.slice(8,10)+"."+z.slice(5,7)+"."+z.slice(0,4)}

/* ---------- Zustand (liegt nur auf diesem Tablet) ---------- */
const LS="sv-kasse-v2";
const S={view:"kasse",kat:"Alkoholfrei",name:null,modus:"deckel",gegeben:"",altMit:true,pinOk:false,armed:null,
  preise:{},pin:"0000",kassenpw:null,offen:false,druck:{breite:80,auto:false},
  stand:null,deckel:{},abrechnungen:[],personen:[],konten:{},kontoLog:[],abende:[],exportiert:null};
const KEYS=["kassenpw","preise","pin","druck","stand","deckel","abrechnungen","personen","konten","kontoLog","abende","exportiert"];
function save(){try{const o={};KEYS.forEach(k=>o[k]=S[k]);localStorage.setItem(LS,JSON.stringify(o))}catch(e){toast("Speichern auf dem Tablet fehlgeschlagen!")}}
function load(){try{const o=JSON.parse(localStorage.getItem(LS))||{};KEYS.forEach(k=>{if(o[k]!=null)S[k]=o[k]})}catch(e){}}
const preis=id=>(S.preise[id]!=null?S.preise[id]:BYID[id].p);
const konto=n=>r2(S.konten[n]||0);

function abendSicher(){
  if(S.stand) return;
  const z=jetzt(); S.stand={id:z.replace(/[-:T]/g,"").slice(0,12),datumText:datumDE(z),start:z};
}
const deckelSumme=n=>r2(Object.values(S.deckel[n]||{}).reduce((s,p)=>s+p.menge*p.preis,0));
const offeneDeckel=()=>Object.keys(S.deckel).filter(n=>deckelSumme(n)>0);

/* ---------- Aktionen ---------- */
function addArtikel(id){
  if(!S.name){toast("Bitte zuerst einen Gast wählen.");return}
  abendSicher();
  const d=S.deckel[S.name]||(S.deckel[S.name]={});
  const p=d[id]||(d[id]={menge:0,preis:preis(id)});
  p.menge++; S.armed=null; save(); render();
}
function minusArtikel(id){
  const d=S.deckel[S.name]; if(!d||!d[id]) return;
  d[id].menge--; if(d[id].menge<=0) delete d[id];
  if(!Object.keys(d).length) delete S.deckel[S.name];
  save(); render();
}
function addPerson(n){if(!S.personen.includes(n)){S.personen.push(n);S.personen.sort((a,b)=>a.localeCompare(b,"de"))}}
function abrechnen(art){
  const n=S.name; abendSicher();
  const posten=Object.entries(S.deckel[n]||{}).map(([id,p])=>({id,artikel:BYID[id].n,kategorie:BYID[id].k,menge:p.menge,preis:p.preis}));
  const verzehr=deckelSumme(n), vorher=konto(n);
  const alt=art==="bar"&&S.altMit&&vorher>0?vorher:0;
  const zahlt=r2(verzehr+alt), geg=parseNum(S.gegeben);
  const a={id:"a"+Date.now(),abend:S.stand.id,zeit:jetzt(),name:n,posten,verzehr,art,alt,
    gegeben:art==="bar"&&geg!=null&&geg>=zahlt?geg:null,kontoVorher:vorher};
  if(art==="anschreiben"){S.konten[n]=r2(vorher+verzehr);S.kontoLog.push({ref:a.id,zeit:a.zeit,abend:a.abend,name:n,art:"angeschrieben",betrag:verzehr})}
  if(alt>0){S.konten[n]=r2(vorher-alt);S.kontoLog.push({ref:a.id,zeit:a.zeit,abend:a.abend,name:n,art:"beglichen",betrag:alt})}
  if(Math.abs(konto(n))<0.005) delete S.konten[n];
  a.kontoNachher=konto(n);
  S.abrechnungen.push(a); delete S.deckel[n]; S.name=null;
  S.modus="deckel"; S.gegeben=""; S.altMit=true; save();
  toast(art==="bar"?`${n}: ${euro(zahlt)} bar bezahlt`:`${n}: ${euro(verzehr)} angeschrieben`);
  render(); if(S.druck.auto) druckeBon(a);
}
function rueckgaengig(){
  const a=S.abrechnungen.pop(); if(!a) return;
  S.konten[a.name]=a.kontoVorher; if(!a.kontoVorher) delete S.konten[a.name];
  S.kontoLog=S.kontoLog.filter(l=>l.ref!==a.id);
  const d=S.deckel[a.name]||(S.deckel[a.name]={});
  a.posten.forEach(p=>{const x=d[p.id]||(d[p.id]={menge:0,preis:p.preis});x.menge+=p.menge});
  if(!Object.keys(d).length) delete S.deckel[a.name];
  S.name=a.name; save(); toast("Abrechnung von "+a.name+" zurückgenommen, Deckel wieder offen"); render();
}

/* ---------- Auswertung ---------- */
function auswertung(list){
  list=list||S.abrechnungen;
  const art={},kat={},pers={}; let verzehr=0,bar=0,an=0,alt=0;
  list.forEach(a=>{verzehr+=a.verzehr;alt+=a.alt;if(a.art==="bar")bar+=a.verzehr+a.alt;else an+=a.verzehr;
    const p=pers[a.name]||(pers[a.name]={verzehr:0,bar:0,an:0});p.verzehr+=a.verzehr;if(a.art==="bar")p.bar+=a.verzehr+a.alt;else p.an+=a.verzehr;
    a.posten.forEach(x=>{const t=art[x.id]||(art[x.id]={menge:0,betrag:0});t.menge+=x.menge;t.betrag=r2(t.betrag+x.menge*x.preis);kat[x.kategorie]=r2((kat[x.kategorie]||0)+x.menge*x.preis)})});
  return {art,kat,pers,verzehr:r2(verzehr),bar:r2(bar),an:r2(an),alt:r2(alt)};
}

async function hash(t){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sv-oberschopfheim|"+t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

  $("#sperren").onclick=()=>{S.pinOk=false;S.view="kasse";render()};
  $("#kpwSet").onclick=async()=>{const a=$("#kpw1").value,b=$("#kpw2").value;
    if(a.length<4){toast("Bitte mindestens 4 Zeichen.");return} if(a!==b){toast("Die beiden Eingaben sind verschieden.");return}
    S.kassenpw=await hash(a);S.offen=true;try{sessionStorage.setItem("sv-offen","1")}catch(x){}save();toast("Kassen-Passwort gesetzt");render()};
  const ko=$("#kpwOff"); if(ko) ko.onclick=()=>{if(S.armed!=="pwweg"){S.armed="pwweg";render();return}S.armed=null;S.kassenpw=null;save();toast("Passwort entfernt");render()};
  v.querySelectorAll("[data-breite]").forEach(x=>x.onclick=()=>{S.druck.breite=+x.dataset.breite;save();render()});
  $("#autoDruck").onclick=()=>{S.druck.auto=!S.druck.auto;save();render()};
  $("#backup").onclick=()=>{const o={version:2};KEYS.forEach(k=>o[k]=S[k]);datei("Kasse-Sicherung-"+jetzt().slice(0,10)+".json",JSON.stringify(o,null,1));toast("Sicherung in Downloads gespeichert")};
  $("#restore").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.version!==2)throw 0;KEYS.forEach(k=>{if(d[k]!=null)S[k]=d[k]});save();toast("Sicherung eingespielt");render()}catch(x){toast("Diese Datei ist keine Kassen-Sicherung.")}};
}

/* ---------- Kassenzettel ---------- */
function druckeBon(a){
  if(!a) return;
  const el=document.getElementById("bondruck");
  el.style.setProperty("--bonw",S.druck.breite+"mm");
  document.getElementById("pagesize").textContent="@page{size:"+S.druck.breite+"mm auto;margin:0}";
  const zahlt=r2(a.verzehr+a.alt);
  el.innerHTML=`<div class="kopf"><img src="logo-bon.png" alt=""><b>Schützenverein Oberschopfheim</b>Vereinsheim</div>
   <div class="meta"><span>${datumDE(a.zeit)} ${a.zeit.slice(11,16)}</span><span>${esc(a.name)}</span></div>
   <div class="pz">${a.posten.map(p=>`<span>${p.menge}×</span><span>${esc(p.artikel)}</span><span>${euro(p.menge*p.preis)}</span>`).join("")}</div>
   ${a.alt?`<div class="gz" style="margin-top:1mm"><span>Angeschriebenes beglichen</span><span>${euro(a.alt)}</span></div>`:""}
   ${a.art==="bar"?`<div class="sum"><span>Summe bar</span><span>${euro(zahlt)}</span></div>
     ${a.gegeben!=null?`<div class="gz"><span>Gegeben</span><span>${euro(a.gegeben)}</span></div><div class="gz"><span>Zurück</span><span>${euro(a.gegeben-zahlt)}</span></div>`:""}`
    :`<div class="sum"><span>Angeschrieben</span><span>${euro(a.verzehr)}</span></div><div class="gz"><span>Offen insgesamt</span><span>${euro(a.kontoNachher)}</span></div>`}
   <div class="fuss">Vielen Dank und Gut Schuss!</div>`;
  const img=el.querySelector("img"), go=()=>setTimeout(()=>window.print(),60);
  if(img.complete) go(); else {img.onload=go;img.onerror=go}
}

/* ---------- Dateien ---------- */
function datei(name,data){
  const blob=new Blob([data],{type:name.endsWith(".json")?"application/json":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
function exportExcel(abend){
  const X=window.XLSX; if(!X){toast("Excel-Baustein fehlt.");return}
  const list=abend?abend.abrechnungen:S.abrechnungen, datumText=abend?abend.datumText:S.stand.datumText, abendId=abend?abend.id:S.stand.id;
  const EUR='#,##0.00 "€"', wb=X.utils.book_new();
  const rows=[["Datum","Uhrzeit","Name","Kategorie","Artikel","Menge","Einzelpreis","Betrag","Zahlart"]];
  list.forEach(a=>a.posten.forEach(p=>rows.push([datumDE(a.zeit),a.zeit.slice(11,16),a.name,p.kategorie,p.artikel,p.menge,p.preis,null,a.art==="bar"?"bar":"angeschrieben"])));
  const wsB=X.utils.aoa_to_sheet(rows);
  for(let r=2;r<=rows.length;r++){wsB["H"+r]={t:"n",f:`F${r}*G${r}`,z:EUR};wsB["G"+r].z=EUR}
  wsB["!cols"]=[{wch:11},{wch:8},{wch:20},{wch:13},{wch:28},{wch:7},{wch:11},{wch:11},{wch:14}];
  const kb=[["Datum","Uhrzeit","Name","Art","Betrag"]];
  S.kontoLog.filter(l=>l.abend===abendId).forEach(l=>kb.push([datumDE(l.zeit),l.zeit.slice(11,16),l.name,l.art,l.betrag]));
  const wsK=X.utils.aoa_to_sheet(kb); for(let r=2;r<=kb.length;r++)wsK["E"+r].z=EUR; wsK["!cols"]=[{wch:11},{wch:8},{wch:20},{wch:14},{wch:11}];
  const ab=[["Abendabrechnung",datumText],["Verzehr gesamt",null],["davon bar bezahlt",null],["davon angeschrieben",null],["Alte Schulden bar beglichen",null],["Bar in der Kasse",null]];
  const wsA=X.utils.aoa_to_sheet(ab);
  wsA.B2={t:"n",f:"SUM(Buchungen!H:H)",z:EUR};
  wsA.B3={t:"n",f:'SUMIFS(Buchungen!H:H,Buchungen!I:I,"bar")',z:EUR};
  wsA.B4={t:"n",f:'SUMIFS(Buchungen!H:H,Buchungen!I:I,"angeschrieben")',z:EUR};
  wsA.B5={t:"n",f:"SUMIFS('Konto-Bewegungen'!E:E,'Konto-Bewegungen'!D:D,\"beglichen\")",z:EUR};
  wsA.B6={t:"n",f:"B3+B5",z:EUR}; wsA["!cols"]=[{wch:28},{wch:14}];
  const ja=[["Artikel","Kategorie","Menge","Umsatz"]].concat(ARTIKEL.map(a=>[a.n,a.k,null,null]));
  const wsJ=X.utils.aoa_to_sheet(ja);
  for(let r=2;r<=ja.length;r++){wsJ["C"+r]={t:"n",f:`SUMIFS(Buchungen!F:F,Buchungen!E:E,A${r})`};wsJ["D"+r]={t:"n",f:`SUMIFS(Buchungen!H:H,Buchungen!E:E,A${r})`,z:EUR}}
  wsJ["!cols"]=[{wch:28},{wch:13},{wch:8},{wch:11}];
  const namen=[...new Set(list.map(a=>a.name))].sort((a,b)=>a.localeCompare(b,"de"));
  const jp=[["Name","Verzehr","Bar bezahlt","Angeschrieben"]].concat(namen.map(x=>[x,null,null,null])); const wsP=X.utils.aoa_to_sheet(jp);
  for(let r=2;r<=jp.length;r++){wsP["B"+r]={t:"n",f:`SUMIFS(Buchungen!H:H,Buchungen!C:C,A${r})`,z:EUR};wsP["C"+r]={t:"n",f:`SUMIFS(Buchungen!H:H,Buchungen!C:C,A${r},Buchungen!I:I,"bar")`,z:EUR};wsP["D"+r]={t:"n",f:`SUMIFS(Buchungen!H:H,Buchungen!C:C,A${r},Buchungen!I:I,"angeschrieben")`,z:EUR}}
  wsP["!cols"]=[{wch:22},{wch:11},{wch:12},{wch:14}];
  const ok=[["Name","Offen (Stand Export)"]].concat(Object.entries(S.konten).filter(([,b])=>b>0).sort((a,b)=>a[0].localeCompare(b[0],"de")));
  const wsO=X.utils.aoa_to_sheet(ok); for(let r=2;r<=ok.length;r++)wsO["B"+r].z=EUR; wsO["!cols"]=[{wch:22},{wch:20}];
  const pr=[["Kategorie","Artikel","Menge","Preis"]].concat(ARTIKEL.map(a=>[a.k,a.n,a.m,preis(a.id)]));
  const wsR=X.utils.aoa_to_sheet(pr); for(let r=2;r<=pr.length;r++)wsR["D"+r].z=EUR; wsR["!cols"]=[{wch:13},{wch:28},{wch:8},{wch:9}];
  X.utils.book_append_sheet(wb,wsA,"Abrechnung");X.utils.book_append_sheet(wb,wsB,"Buchungen");X.utils.book_append_sheet(wb,wsK,"Konto-Bewegungen");
  X.utils.book_append_sheet(wb,wsJ,"Je Artikel");X.utils.book_append_sheet(wb,wsP,"Je Person");X.utils.book_append_sheet(wb,wsO,"Offene Konten");X.utils.book_append_sheet(wb,wsR,"Preisliste");
  datei("Kasse Vereinsheim "+datumText.replace(/\./g,"-")+".xlsx",X.write(wb,{bookType:"xlsx",type:"array"}));
  if(!abend){S.exportiert=S.stand.id;save()} toast("Excel in Downloads gespeichert"); render();
}

load(); try{S.offen=sessionStorage.getItem("sv-offen")==="1"}catch(x){} try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render();
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
